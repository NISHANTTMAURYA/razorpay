publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.3
  google_sign_in: ^6.2.2
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  http: ^1.3.0
